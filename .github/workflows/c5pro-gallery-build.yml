name: Render C5 Pro gallery

on:
  push:
    branches: [ci/skip-main-fork-review]
    paths:
      - '.github/workflows/c5pro-gallery-build.yml'
      - 'ci/generate-c5pro-gallery.sh'
      - 'ci/ui-scenarios/c5pro-gallery.txt'
      - 'tests/screenshot_capture_test.cpp'

permissions:
  contents: write

concurrency:
  group: c5pro-gallery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    if: github.repository == 'ghzserg/guppyscreen_ff5m'
    runs-on: ubuntu-22.04
    steps:
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git make cmake gcc g++ pkg-config python3

      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Patch LVGL dependencies
        run: bash ci/apply-patches.sh ad5m

      - name: Render C5 Pro screens
        run: bash ci/generate-c5pro-gallery.sh

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: c5pro-gallery
          path: docs/screenshots/c5pro/*.png
          if-no-files-found: warn

      - name: Commit generated screenshots to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin ci/skip-main-fork-review
          git reset --hard FETCH_HEAD
          git add docs/screenshots/c5pro/*.png
          if ! git diff --cached --quiet; then
            git commit -m 'Add captured C5 Pro screen gallery'
            git push origin HEAD:ci/skip-main-fork-review
          fi
