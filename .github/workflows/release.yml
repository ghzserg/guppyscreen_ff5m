name: GuppyScreen builds

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    container: debian:13
    defaults:
      run:
        shell: bash
    steps:
      - name: Install host test dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git make cmake gcc g++ pkg-config

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply build patches (AD5M)
        run: bash ci/apply-patches.sh ad5m

      - name: Run tests (ASan/UBSan)
        run: make test SANITIZE=1

  tsan:
    runs-on: ubuntu-24.04
    steps:
      - name: Install host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates git make cmake gcc g++ pkg-config

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply build patches (AD5M)
        run: bash ci/apply-patches.sh ad5m

      - name: Configure address space for ThreadSanitizer
        run: |
          if [ "$(sysctl -n vm.mmap_rnd_bits)" -gt 28 ]; then
            sudo sysctl -w vm.mmap_rnd_bits=28
          fi

      - name: Run tests (TSan)
        run: make test SANITIZE=thread

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tsan-logs
          path: build-test/tsan/logs/
          if-no-files-found: ignore

  build:
    needs: [test, tsan]
    runs-on: ubuntu-22.04
    container: debian:13
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: ad5x
            sdk: mipsel-zmod-ad5x.tar.gz
            sha256: e492d11f9e8a87c60b01f1221294d9ab72ec47e9c1f970be936e48d18c36156e
          - model: ad5m
            sdk: arm-zmod-ad5m.tar.gz
            sha256: 346a0e1cab48a1ba0c2b933a7f1f05a3a0b061b602097037a91f9f58637d1dd4
    steps:
      - name: Install Debian 13 build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git make cmake gcc g++ binutils pkg-config \
            file zip unzip gettext tar gzip xz-utils patch python3

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/cache@v4
        id: sdk-cache
        with:
          path: ${{ runner.temp }}/guppy-sdk.tar.gz
          key: guppy-sdk-${{ matrix.model }}-${{ matrix.sha256 }}

      - name: Download Buildroot SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        env:
          SDK_NAME: ${{ matrix.sdk }}
        run: |
          curl --fail --location --retry 3 --retry-delay 5 \
            "https://github.com/ghzserg/FF/releases/download/R/${SDK_NAME}" \
            --output "$RUNNER_TEMP/guppy-sdk.tar.gz"

      - name: Verify SDK
        env:
          SDK_SHA256: ${{ matrix.sha256 }}
        run: |
          echo "${SDK_SHA256}  $RUNNER_TEMP/guppy-sdk.tar.gz" | sha256sum --check --status

      - name: Build and package
        env:
          MODEL: ${{ matrix.model }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            export GUPPYSCREEN_VERSION="${GITHUB_REF#refs/tags/}"
          else
            export GUPPYSCREEN_VERSION="dev-${GITHUB_SHA:0:8}"
          fi
          bash ci/build-release.sh "$MODEL" "$RUNNER_TEMP/guppy-sdk.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: guppyscreen-${{ matrix.model }}
          path: guppyscreen-${{ matrix.model }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: guppyscreen-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
