name: One-time C5 Pro cube screenshots

on:
  push:
    branches: [docs/c5pro-readme-calibration-exclude-tune]
    paths:
      - '.github/workflows/one-time-c5pro-cube-gallery.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.repository == 'ghzserg/guppyscreen_ff5m'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Retrieve previously captured LVGL screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45152888286 -R ghzserg/guppyscreen_ff5m \
            -n c5pro-cube-capture -D "$RUNNER_TEMP/c5pro-cube-capture"
          for file in print.png file-preview.png print-status.png print-paused.png; do
            cp "$RUNNER_TEMP/c5pro-cube-capture/$file" "docs/screenshots/c5pro/$file"
          done
      - name: Commit verified cube screenshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/c5pro/print.png docs/screenshots/c5pro/file-preview.png \
                  docs/screenshots/c5pro/print-status.png docs/screenshots/c5pro/print-paused.png
          if ! git diff --cached --quiet; then
            git commit -m 'Show shared cube thumbnail on file selection and printing'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
