name: UI review

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

concurrency:
  group: ui-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.body, 'UI-Review:')
    runs-on: ubuntu-22.04
    container: debian:13
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.prepare.outputs.pr_number }}
      head_sha: ${{ steps.prepare.outputs.head_sha }}
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git make cmake gcc g++ pkg-config python3 curl

      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare requested screens
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 ci/ui-review-request.py "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/ui-review-scenario.txt"

      - name: Capture before and after
        env:
          BASE_SHA: ${{ steps.prepare.outputs.base_sha }}
          HEAD_SHA: ${{ steps.prepare.outputs.head_sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          bash ci/ui-review.sh "$BASE_SHA" "$HEAD_SHA" \
            "$RUNNER_TEMP/ui-review-scenario.txt" "$RUNNER_TEMP/ui-review"

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ui-review-evidence
          path: ${{ runner.temp }}/ui-review/
          if-no-files-found: ignore

  publish:
    needs: capture
    if: needs.capture.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.2
        with:
          name: ui-review-evidence
          path: ${{ runner.temp }}/ui-review

      - name: Publish PNG and update PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.capture.outputs.pr_number }}
          HEAD_SHA: ${{ needs.capture.outputs.head_sha }}
        run: |
          bash ci/publish-review.sh "$RUNNER_TEMP/ui-review"
          python3 ci/ui-review-post.py "$RUNNER_TEMP/ui-review/review-public.md" "$PR_NUMBER" "$HEAD_SHA"
